version: "2"
run:
  modules-download-mode: readonly
linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unused
    - whitespace
  settings:
    dupl:
      threshold: 100
    goconst:
      min-len: 2
      min-occurrences: 2
    gocritic:
      disabled-checks:
        - dupImport
        - ifElseChain
        - octalLiteral
        - whyNoLint
        - wrapperFunc
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
    gocyclo:
      min-complexity: 15
    lll:
      line-length: 140
    misspell:
      locale: US
    staticcheck:
      checks:
        - all
        - -QF*
  exclusions:
    generated: lax
    rules:
      - linters:
          - bodyclose
          - errcheck
          - unused
        path: _test\.go
      - linters:
          - unused
        path: testdata/
      - linters:
          - bodyclose
          - errcheck
          - unused
        path: internal/testutil/
      - linters:
          - bodyclose
          - errcheck
        path: test/
      - linters:
          - unused
        path: src/
      - linters:
          - bodyclose
          - errcheck
        path: cmd/integration_testing.go
      - linters:
          - errcheck
        path: cmd/export.go
      - path: (.+)\.go$
        text: Error return value of .((os\.)?std(out|err)\..*|.*Close|.*Flush|os\.Remove(All)?|.*printf?|os\.(Un)?Setenv). is not checked
      - path: (.+)\.go$
        text: cyclomatic complexity .* of func .* is high
      - path: (.+)\.go$
        text: string .* has .* occurrences, make it a constant
      - path: (.+)\.go$
        text: 'commentedOutCode: may want to remove commented-out code'
      - path: (.+)\.go$
        text: 'appendCombine: can combine chain of .* appends into one'
      - path: (.+)\.go$
        text: at least one file in a package should have a package comment
      - path: (.+)\.go$
        text: Potential file inclusion via variable
      - path: (.+)\.go$
        text: Expect directory permissions to be 0750 or less
      - path: (.+)\.go$
        text: Expect WriteFile permissions to be 0600 or less
      - path: (.+)\.go$
        text: var .* is unused
      - path: (.+)\.go$
        text: func .* is unused
      - path: (.+)\.go$
        text: Error return value of.*is not checked
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/silouanwright/gh-comment
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
